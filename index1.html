<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trò Chơi Kéo - Búa - Bao</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        text-align: center;
        margin: 0;
        padding: 30px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffd700;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .score-board {
        display: flex;
        justify-content: space-around;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #333;
      }
      .buttons button {
        font-size: 40px; /* Đã tăng kích thước icon/chữ theo yêu cầu cũ */
        padding: 25px 35px; /* Đã tăng kích thước nút theo yêu cầu cũ */
        margin: 5px;
        cursor: pointer;
        border: none;
        border-radius: 50px;
        background-color: #007bff;
        color: white;
        transition: background 0.3s;
      }
      .buttons button:hover {
        background-color: #0056b3;
      }
      .buttons button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      .status {
        font-size: 25px;
        margin: 20px 0;
        font-weight: bold;
        color: #d9534f;
      }
      /* Style cho nút Chơi Lại */
      .btn-restart {
        font-size: 18px;
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        display: none; /* Ẩn đi khi mới vào game */
        margin: 10px auto;
      }
      .btn-restart:hover {
        background-color: #218838;
      }
      .history {
        text-align: left;
        background: #eee;
        padding: 15px;
        border-radius: 5px;
        max-height: 250px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Trò Chơi Kéo - Búa - Bao</h2>
      <p>Trò chơi kết thúc khi có người đạt 3.5 điểm</p>

      <div class="score-board">
        <div>Người: <span id="diemNguoi">0</span></div>
        <div>Máy: <span id="diemMay">0</span></div>
      </div>

      <div class="buttons" id="btnGroup">
        <button onclick="choi('kéo')">✌️ Kéo</button>
        <button onclick="choi('búa')">✊ Búa</button>
        <button onclick="choi('bao')">🖐️ Bao</button>
      </div>

      <div class="status" id="trangThai">
        Hãy chọn Kéo, Búa, hoặc Bao để bắt đầu!
      </div>

      <!-- Nút chơi lại được thêm vào đây -->
      <button class="btn-restart" id="btnChoiLai" onclick="choiLai()">
        🔄 Chơi Mới Lại
      </button>

      <h3>Lịch sử chơi:</h3>
      <div class="history" id="lichSu"></div>
    </div>

    <script>
      let diemNguoi = 0;
      let diemMay = 0;
      let lanChoi = 1;

      // Khởi tạo hiệu ứng âm thanh (Bạn có thể thay link bằng file âm thanh của bạn, ví dụ: 'thang.mp3')
      const amThanhThang = new Audio(
        "https://www.myinstants.com/media/sounds/correct-choice.mp3",
      );
      const amThanhThua = new Audio(
        "https://www.myinstants.com/media/sounds/wrong-answer-sound-effect.mp3",
      );

      function choi(nguoiRa) {
        if (diemNguoi >= 3.5 || diemMay >= 3.5) return;

        const luaChon = ["kéo", "búa", "bao"];
        const mayRa = luaChon[Math.floor(Math.random() * 3)];
        let ketQua = "";

        if (nguoiRa === mayRa) {
          ketQua = "Người hòa";
          diemNguoi += 0.5;
          diemMay += 0.5;
        } else if (
          (nguoiRa === "kéo" && mayRa === "bao") ||
          (nguoiRa === "búa" && mayRa === "kéo") ||
          (nguoiRa === "bao" && mayRa === "búa")
        ) {
          ketQua = "Người thắng";
          diemNguoi += 1;
          // Phát nhạc khi người thắng mỗi lần chơi
          amThanhThang.currentTime = 0;
          amThanhThang.play();
        } else {
          ketQua = "Máy thắng";
          diemMay += 1;
          // Phát nhạc khi máy thắng mỗi lần chơi
          amThanhThua.currentTime = 0;
          amThanhThua.play();
        }

        document.getElementById("diemNguoi").innerText = diemNguoi;
        document.getElementById("diemMay").innerText = diemMay;

        document.getElementById("trangThai").innerText =
          `Lần ${lanChoi}: Bạn ra ${nguoiRa.toUpperCase()}, Máy ra ${mayRa.toUpperCase()} => ${ketQua}!`;
        document.getElementById("trangThai").style.color = "#d9534f";

        const dongLichSu = document.createElement("div");
        dongLichSu.innerText = `Lần ${lanChoi} | Người: ${nguoiRa} - Máy: ${mayRa} | Kết quả: ${ketQua}`;
        const lichSuDiv = document.getElementById("lichSu");
        lichSuDiv.insertBefore(dongLichSu, lichSuDiv.firstChild);

        lanChoi++;

        if (diemNguoi >= 3.5 || diemMay >= 3.5) {
          ketThucTroChoi();
        }
      }

      function ketThucTroChoi() {
        const buttons = document.querySelectorAll(".buttons button");
        buttons.forEach((btn) => (btn.disabled = true));

        let ketLuan = "KẾT QUẢ CHUNG CUỘC: ";
        if (diemNguoi > diemMay) ketLuan += "BẠN ĐÃ THẮNG! 🎉";
        else if (diemNguoi < diemMay) ketLuan += "MÁY ĐÃ THẮNG! 🤖";
        else ketLuan += "HÒA NHAU! 🤝";

        document.getElementById("trangThai").innerText = ketLuan;
        document.getElementById("trangThai").style.color = "#28a745";
        document.getElementById("trangThai").style.fontSize = "22px";

        // Hiển thị nút Chơi Mới Lại khi game kết thúc
        document.getElementById("btnChoiLai").style.display = "block";
      }

      // Hàm Reset lại toàn bộ trò chơi
      function choiLai() {
        diemNguoi = 0;
        diemMay = 0;
        lanChoi = 1;

        // Reset giao diện
        document.getElementById("diemNguoi").innerText = diemNguoi;
        document.getElementById("diemMay").innerText = diemMay;
        document.getElementById("lichSu").innerHTML = ""; // Xóa lịch sử cũ

        document.getElementById("trangThai").innerText =
          "Hãy chọn Kéo, Búa, hoặc Bao để bắt đầu!";
        document.getElementById("trangThai").style.color = "#d9534f";
        document.getElementById("trangThai").style.fontSize = "18px";

        // Mở khóa các nút kéo búa bao
        const buttons = document.querySelectorAll(".buttons button");
        buttons.forEach((btn) => (btn.disabled = false));

        // Ẩn nút Chơi Lại đi
        document.getElementById("btnChoiLai").style.display = "none";
      }
    </script>
  </body>
</html>
